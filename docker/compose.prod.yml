services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barberflow}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-barberflow_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-barberflow_owner} -d ${POSTGRES_DB:-barberflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PORT: 3000
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER}
      DATABASE_URL_APP: ${DATABASE_URL_APP}
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://${DOMAIN}
    networks:
      - db_internal
      - web_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      - web_net
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web_net
    depends_on:
      - web
      - api

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:

networks:
  db_internal:
    internal: true
  web_net:
